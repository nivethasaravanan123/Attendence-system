version: '3.8'

services:
  # Database Service (PostgreSQL)
  postgres_db:
    image: postgres:16-alpine
    container_name: twite_attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: twite_admin
      POSTGRES_PASSWORD: twite_secure_password_2026
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - attendance_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twite_attendance_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: twite_ai_production_jwt_key_2026_super_secret
    depends_on:
      - postgres_db
    networks:
      - attendance_network

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twite_attendance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - attendance_network

networks:
  attendance_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
